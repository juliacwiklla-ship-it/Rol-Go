<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROL GO | Wrotkowisko • Kawiarnia • Zabawa</title>
<meta name="description" content="ROL GO — nowoczesne wrotkowisko z mini kawiarnią. Sucha Beskidzka.">

<style>
:root{
--navy:#07132e;--navy2:#0d2148;--cyan:#10c9f3;
--yellow:#ffd21c;--pink:#ff2aa6;--white:#fff;
--muted:#b9c7df;--line:#ffffff1c
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;background:var(--navy);color:#fff;
font-family:Inter,Arial,sans-serif;line-height:1.5
}
a{color:inherit}
.container{width:min(1120px,calc(100% - 40px));margin:auto}

header{
position:sticky;top:0;z-index:20;background:#07132eee;
backdrop-filter:blur(12px);border-bottom:1px solid var(--line)
}
.nav{
height:78px;display:flex;align-items:center;
justify-content:space-between
}
.brand img{width:68px;height:68px;object-fit:contain}
.links{display:flex;gap:20px;font-weight:800;flex-wrap:wrap}
.links a{text-decoration:none}
.links a:hover{color:var(--yellow)}
.menu{
display:none;border:0;background:none;color:white;
font-size:30px
}

.hero{
min-height:calc(100vh - 78px);display:grid;
grid-template-columns:1fr 1fr;align-items:center;
gap:30px;padding:65px 0
}
.badge{
display:inline-block;color:var(--yellow);
font-weight:900;letter-spacing:3px;text-transform:uppercase
}
h1{
font-size:clamp(65px,10vw,125px);line-height:.78;
margin:17px 0;background:linear-gradient(
90deg,var(--cyan),#61dcff,var(--yellow));
-webkit-background-clip:text;color:transparent
}
.hero h2{
font-size:clamp(27px,4vw,46px);
line-height:1.05;margin:0 0 18px
}
.lead{font-size:20px;color:var(--muted);max-width:650px}
.actions{
display:flex;gap:12px;flex-wrap:wrap;margin-top:26px
}
.btn{
display:inline-block;padding:14px 24px;
border-radius:999px;text-decoration:none;font-weight:900
}
.primary{
background:var(--pink);
box-shadow:0 12px 35px #ff2aa64a
}
.secondary{border:2px solid #ffffff35}
.hero-art{
width:100%;max-width:560px;margin:auto;display:block;
filter:drop-shadow(0 30px 45px #0009)
}

section{padding:90px 0}
.section-head{margin-bottom:30px}
.eyebrow{
color:var(--pink);font-weight:900;letter-spacing:2px
}
.section-head h2{
font-size:clamp(36px,5vw,58px);margin:5px 0 8px
}
.section-head p{color:var(--muted);font-size:18px}

.cards{
display:grid;grid-template-columns:repeat(3,1fr);gap:18px
}
.card{
background:linear-gradient(145deg,#102651,#0b1b3b);
border:1px solid var(--line);border-radius:26px;
padding:28px;min-height:205px
}
.icon{font-size:38px}
.card h3{font-size:24px;margin:12px 0 7px}
.card p{color:var(--muted);margin:0}

.dark{background:#050c1d}
.price{
font-size:40px;font-weight:1000;color:var(--yellow)
}
.price small{
font-size:15px;color:var(--muted);font-weight:700
}
.price-card{min-height:0}
.price-card ul{
padding:0;margin:16px 0 0;
list-style:none;color:var(--muted)
}
.price-card li{
padding:6px 0;border-bottom:1px solid var(--line)
}

.gallery{
display:grid;grid-template-columns:1.2fr .8fr;gap:18px
}
.gallery img{
width:100%;height:100%;object-fit:cover;
border-radius:25px;border:1px solid var(--line)
}
.gallery .big{min-height:520px}

.events{
display:grid;grid-template-columns:repeat(3,1fr);gap:18px
}
.event{
padding:25px;border-radius:24px;
background:#111f3d;border:1px solid var(--line)
}
.event strong{font-size:21px}
.event p{color:var(--muted)}

.contact{
display:grid;grid-template-columns:1fr 1fr;gap:25px
}
.contact-box{
padding:32px;border-radius:28px;
background:linear-gradient(135deg,#122b59,#14123d);
border:1px solid var(--line)
}
.contact-row{
padding:14px 0;border-bottom:1px solid var(--line)
}
.contact-row b{
display:block;color:var(--cyan)
}

footer{
padding:35px 0;color:#8fa2c3;
border-top:1px solid var(--line);text-align:center
}
.note{font-size:13px;color:#8396b8;margin-top:20px}

/* ===== REZERWACJA ===== */

.booking-wrap{
display:grid;grid-template-columns:1.15fr .85fr;gap:24px
}

.calendar-box,.booking-form{
background:linear-gradient(145deg,#102651,#0b1b3b);
border:1px solid var(--line);
border-radius:28px;
padding:24px
}

.calendar-head{
display:flex;align-items:center;
justify-content:space-between;
gap:12px;margin-bottom:18px
}

.calendar-head h3{
margin:0;font-size:26px
}

.cal-btn{
border:1px solid #ffffff35;
background:#07132e;color:#fff;
border-radius:12px;
padding:10px 14px;
font-size:20px;
cursor:pointer
}

.weekdays,.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:7px
}

.weekdays div{
text-align:center;color:var(--muted);
font-size:12px;font-weight:800;padding:5px 0
}

.day{
min-height:48px;
border:1px solid #ffffff18;
border-radius:12px;
background:#0b1b3b;
color:#fff;
cursor:pointer;
font-weight:800
}

.day.empty{
visibility:hidden;
cursor:default
}

.day.past{
opacity:.3;
cursor:not-allowed
}

.day.available{
border-color:#25d366;
background:#103d32
}

.day.booked{
border-color:#ff3b30;
background:#7d1f25;
color:#fff;
cursor:not-allowed
}

.day.selected{
outline:3px solid var(--yellow);
background:#665600
}

.booking-legend{
display:flex;
gap:16px;
flex-wrap:wrap;
margin-top:16px;
color:var(--muted);
font-size:13px
}

.legend-item{
display:flex;
align-items:center;
gap:7px
}

.legend-dot{
width:13px;
height:13px;
border-radius:4px
}

.green{background:#25d366}
.red{background:#ff3b30}
.yellow{background:var(--yellow)}

.booking-form h3{
margin-top:0;font-size:26px
}

.booking-form label{
display:block;
margin:13px 0 6px;
font-weight:800
}

.booking-form input,
.booking-form select{
width:100%;
padding:13px;
border-radius:12px;
border:1px solid #ffffff2a;
background:#07132e;
color:#fff;
font-size:16px
}

.payment-options{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.payment-options label{
margin:0;
padding:12px;
border:1px solid #ffffff25;
border-radius:12px;
cursor:pointer;
font-size:14px
}

.payment-options input{
width:auto;
margin-right:6px
}

.booking-status{
margin-top:15px;
padding:12px;
border-radius:12px;
display:none
}

.booking-status.ok{
display:block;
background:#124b2c;
border:1px solid #25d366
}

.booking-status.error{
display:block;
background:#5b1e23;
border:1px solid #ff3b30
}

.booking-note{
font-size:12px;
color:var(--muted);
margin-top:12px
}

@media(max-width:800px){
.links{display:none}
.menu{display:block}
.hero,.contact,.gallery{grid-template-columns:1fr}
.cards,.events{grid-template-columns:1fr}
.booking-wrap{grid-template-columns:1fr}
.hero{text-align:center;padding-top:35px}
.lead{margin-left:auto;margin-right:auto}
.actions{justify-content:center}
.hero-art{max-width:440px}
.gallery .big{min-height:auto}
.day{min-height:43px;padding:4px}
.calendar-head h3{font-size:21px}
}
</style>
</head>
